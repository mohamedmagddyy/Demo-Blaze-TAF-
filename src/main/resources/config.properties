# DemoBlaze Test Automation Framework - Configuration
# Browser Type: CHROME, EDGE, FIREFOX
browserType=CHROME

# Base URL for the application
baseURL=https://www.demoblaze.com

# Implicit wait time in seconds
implicitWait=10

# Page load timeout in seconds
pageLoadTimeout=15

# Explicit wait time in seconds
explicitWait=15

# Headless execution (true/false)
headless=false

# Maximize window (true/false)
maximizeWindow=true

# Screenshots on failure (true/false)
takeScreenshotOnFailure=true

# Screenshot directory
screenshotDirectory=./screenshots/

# Reports directory
reportsDirectory=./reports/

# Log level (DEBUG, INFO, WARN, ERROR)
logLevel=INFO

# Login Credentials
login.username=mohamedmagdy
login.password=123456
