name: E2E Functional Tests (manual)

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run (CHROME, FIREFOX, EDGE)'
        required: true
        default: 'CHROME'

jobs:
  functional:
    name: "Functional tests (${{ github.event.inputs.browser }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 and cache Maven deps
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: "Run functional tests (browser: ${{ github.event.inputs.browser }})"
        run: |
          mvn -B clean test \
            -DtestNG.suite=testng-functional.xml \
            -DbrowserType=${{ github.event.inputs.browser }} \
            -Dheadless=true

      - name: Generate Allure Report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-functional-${{ github.event.inputs.browser }}
          path: target/site/allure-maven-plugin/

      - name: Upload ExtentReport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-functional-${{ github.event.inputs.browser }}
          path: test-output/ExtentReport.html

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-functional-${{ github.event.inputs.browser }}
          path: test-output/screenshots/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-functional-${{ github.event.inputs.browser }}
          path: logs/automation.log