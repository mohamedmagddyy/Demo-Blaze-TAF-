name: Regression Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  regression:
    name: "Regression Tests (${{ matrix.browser }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [CHROME, FIREFOX, EDGE]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 and cache Maven deps
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: "Run regression tests (browser: ${{ matrix.browser }})"
        run: |
          mvn -B clean test \
            -DtestNG.suite=testng-regression.xml \
            -DbrowserType=${{ matrix.browser }} \
            -Dheadless=true

      - name: Generate Allure Report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-regression-${{ matrix.browser }}
          path: target/site/allure-maven-plugin/

      - name: Upload ExtentReport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-regression-${{ matrix.browser }}
          path: test-output/ExtentReport.html

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-regression-${{ matrix.browser }}
          path: test-output/screenshots/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-regression-${{ matrix.browser }}
          path: logs/automation.log